name: Release - Atlas CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and sign Atlas
        working-directory: cmd/atlas
        env:
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../../dist
          binary="../../dist/atlas-linux-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=${TAG} -X ariga.io/atlas/cmd/atlas/internal/cmdapi.flavor=community" \
            -o "${binary}" .
          sha256sum "${binary}" > "${binary}.sha256"
          cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish immutable release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Atlas ${GITHUB_REF_NAME}" \
            --generate-notes

  image:
    name: Publish Alpine image
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: atlas-image-lifecycle
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download and verify release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'atlas-linux-*' \
            --dir .github/ops/atlas

          escaped_tag="${RELEASE_TAG//./\\.}"
          identity="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release-atlas_oss\\.yaml@refs/tags/${escaped_tag}$"
          for arch in amd64 arm64; do
            binary=".github/ops/atlas/atlas-linux-${arch}"
            sha="${binary}.sha256"
            bundle="${binary}.bundle"
            test -s "${binary}"
            test -s "${sha}"
            test -s "${bundle}"
            read -r expected _ < "${sha}"
            actual="$(sha256sum "${binary}")"
            actual="${actual%% *}"
            test "${actual}" = "${expected}"
            cosign verify-blob \
              --bundle "${bundle}" \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${binary}"
            mv "${binary}" ".github/ops/atlas/atlas-${arch}"
          done
          rm -f .github/ops/atlas/*.sha256 .github/ops/atlas/*.bundle

      - name: Set image metadata
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/atlas:${version}-alpine"
          source="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "source=${source}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Build and push Alpine image
        id: build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: ./.github/ops/atlas
          file: ./.github/ops/atlas/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ steps.image.outputs.source }}

      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Cleanup GHCR image lifecycle
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-tags: '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+-alpine$'
          use-regex: true
          keep-n-tagged: 5
          exclude-tags: '^(dev|dev-alpine)$'
          delete-untagged: true
          delete-orphaned-images: true
          validate: true

name: Release - Atlas CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build and sign Atlas
        working-directory: cmd/atlas
        env:
          GOARCH: ${{ matrix.arch }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ../../dist
          binary="../../dist/atlas-linux-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=${TAG} -X ariga.io/atlas/cmd/atlas/internal/cmdapi.flavor=community" \
            -o "${binary}" .
          sha256sum "${binary}" > "${binary}.sha256"
          cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish immutable release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Atlas ${GITHUB_REF_NAME}" \
            --generate-notes

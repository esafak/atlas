name: Go SDK CI
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["atlasexec", "sdk"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - name: Run Go linters
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          working-directory: ${{ matrix.module }}
          args: --verbose --timeout 15m
  
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ["atlasexec", "sdk"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}
        env:
          ATLAS_DEBUG: "true"
      - name: Run tests
        run: |
          if [ -n "$ATLAS_TOKEN" ]; then
            go test -race ./...
          else
            go test -race -skip 'TestAtlasMigrate_Lint/(lint_error_parsing|lint_with_manually_parsing_output|lint_uses_--base_and_--latest)|TestMigrate_Diff' ./...
          fi
        working-directory: ${{ matrix.module }}
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
  
  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
        with:
          cloud-token: ${{ secrets.ATLAS_TOKEN }}
        env:
          ATLAS_DEBUG: "true"
      - name: Run e2e tests
        run: |
          if [ -n "$ATLAS_TOKEN" ]; then
            go test ./internal/e2e
          else
            go test -skip 'Test_SchemaPlan' ./internal/e2e
          fi
        working-directory: atlasexec
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          ATLASEXEC_E2ETEST: "1"
          ATLASEXEC_E2ETEST_ATLAS_PATH: atlas
          ATLASEXEC_E2ETEST_POSTGRES_URL: "postgres://postgres:pass@localhost:5432/postgres?search_path=public&sslmode=disable"

name: Validate - Atlas CLI Pre-release

on:
  pull_request:
    paths:
      - "cmd/atlas/**"
      - "internal/integration/**"
      - "atlasexec/**"
      - "schemahcl/**"
      - "sql/**"
      - "go.mod"
      - "go.sum"
      - ".github/ops/atlas/**"
      - ".github/scripts/atlas-alpine-smoke.sh"
      - ".github/workflows/cli-prerelease_oss.yaml"
  push:
    branches:
      - dev
    paths:
      - "cmd/atlas/**"
      - "internal/integration/**"
      - "atlasexec/**"
      - "schemahcl/**"
      - "sql/**"
      - "go.mod"
      - "go.sum"
      - ".github/ops/atlas/**"
      - ".github/scripts/atlas-alpine-smoke.sh"
      - ".github/workflows/cli-prerelease_oss.yaml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-hex commit SHA to test (defaults to the ref head)
        required: false
        type: string
      run_integration:
        description: Run the TiDB 5/6/8 integration and script matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || 'dev-dispatch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATLAS_NO_UPGRADE_SUGGESTIONS: 1

jobs:
  resolve:
    name: Resolve source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA}"
          if [ -z "${sha}" ]; then
            sha="${DEFAULT_SHA}"
          fi
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-hex commit SHA, got: ${sha}" >&2
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" >/dev/null; then
            echo "commit ${sha} was not found in ${GITHUB_REPOSITORY}; push it to a branch first" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  unit:
    name: Unit and CLI tests
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0.3
      - name: Run SQL and migration tests
        run: go test ./sql/mysql ./sql/migrate ./sql/internal/specutil ./sql/internal/sqlx -count=1
      - name: Run CLI tests
        working-directory: cmd/atlas
        run: go test ./... -count=1
      - name: Run atlasexec tests
        # These commands require an Atlas Pro token; the workflow has no
        # credential and the host-artifact contract is covered separately.
        run: go test ./atlasexec -count=1 -skip '^(TestAtlasMigrate_Lint|TestMigrate_Diff)$'

  build:
    name: Build linux/${{ matrix.arch }}
    needs: [unit, resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - name: Build host and Alpine Atlas binaries
        working-directory: cmd/atlas
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: dev-${{ needs.resolve.outputs.sha }}
          # The operator's host-side SQLite tests consume the amd64 artifact.
          # Keep arm64 portable until its cross-compiler build is enabled.
          CGO_ENABLED: ${{ matrix.arch == 'amd64' && '1' || '0' }}
        run: |
          mkdir -p ../../dist
          for flavor in host alpine; do
            if [ "${flavor}" = alpine ]; then
              export CGO_ENABLED=0
              binary="../../dist/atlas-alpine-linux-${GOARCH}"
            else
              export CGO_ENABLED="${{ matrix.arch == 'amd64' && '1' || '0' }}"
              binary="../../dist/atlas-linux-${GOARCH}"
            fi
            go build -trimpath \
              -ldflags "-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=${VERSION}" \
              -o "${binary}" .
            sha256sum "${binary}" > "${binary}.sha256"
          done
      - name: Check amd64 host cgo binary
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          dist/atlas-linux-amd64 version
          readelf -l dist/atlas-linux-amd64 | grep -F '/lib64/ld-linux-x86-64.so.2'
          ldd dist/atlas-linux-amd64 | grep -F 'libc.so.6'
          ATLASEXEC_E2ETEST=1 \
          ATLASEXEC_E2ETEST_ATLAS_PATH="${GITHUB_WORKSPACE}/dist/atlas-linux-amd64" \
          go test ./atlasexec/internal/e2e -run '^Test_SQLite$' -count=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-cli-linux-${{ matrix.arch }}-${{ needs.resolve.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: TiDB integration matrix
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.run_integration) }}
    needs: [unit, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - name: Start TiDB services
        working-directory: internal/integration
        run: docker compose --project-name atlas-integration up -d tidb5 tidb6 tidb8
      - name: Run TiDB integration matrix
        working-directory: internal/integration
        run: |
          for version in tidb5 tidb6 tidb8; do
            go test -run '^TestTiDB_' -version="${version}" -timeout 15m ./...
            go test -run '^TestTiDB_Script$' -version="${version}" -timeout 15m ./...
          done

  sign:
    name: Publish trusted dev release
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    needs: [build, integration, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: atlas-cli-linux-amd64-${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          name: atlas-cli-linux-arm64-${{ needs.resolve.outputs.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign binaries
        run: |
          for binary in \
            dist/atlas-linux-amd64 \
            dist/atlas-linux-arm64 \
            dist/atlas-alpine-linux-amd64 \
            dist/atlas-alpine-linux-arm64; do
            cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-cli-signed-${{ needs.resolve.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish mutable dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: dev
          DEV_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh release delete "${DEV_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${DEV_TAG}" >/dev/null 2>&1 || true

          gh release create "${DEV_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${DEV_SOURCE_SHA}" \
            --title "Atlas CLI ${DEV_TAG}" \
            --prerelease \
            --generate-notes

  image:
    name: Publish dev Alpine image
    if: ${{ needs.sign.result == 'success' }}
    needs: [sign, resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: atlas-image-lifecycle
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atlas-cli-signed-${{ needs.resolve.outputs.sha }}
          path: .github/ops/atlas

      - name: Verify and stage Alpine binaries
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          escaped_ref="${GITHUB_REF//./\\.}"
          identity="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/cli-prerelease_oss\\.yaml@${escaped_ref}$"
          for arch in amd64 arm64; do
            binary=".github/ops/atlas/atlas-alpine-linux-${arch}"
            sha="${binary}.sha256"
            bundle="${binary}.bundle"
            test -s "${binary}"
            test -s "${sha}"
            test -s "${bundle}"
            read -r expected _ < "${sha}"
            actual="$(sha256sum "${binary}")"
            actual="${actual%% *}"
            test "${actual}" = "${expected}"
            cosign verify-blob \
              --bundle "${bundle}" \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${binary}"
            mv "${binary}" ".github/ops/atlas/atlas-${arch}"
          done
          rm -f .github/ops/atlas/*.sha256 .github/ops/atlas/*.bundle
          rm -f .github/ops/atlas/atlas-linux-amd64 .github/ops/atlas/atlas-linux-arm64
          test ! -e .github/ops/atlas/atlas-linux-amd64
          test ! -e .github/ops/atlas/atlas-linux-arm64
          expected=$(printf '%s\n' \
            .github/ops/atlas/Dockerfile \
            .github/ops/atlas/atlas-amd64 \
            .github/ops/atlas/atlas-arm64)
          actual=$(find .github/ops/atlas -maxdepth 1 -type f -print | sort)
          test "${actual}" = "${expected}"

      - name: Set image metadata
        id: image
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/atlas:dev-alpine"
          sha_image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/atlas:sha-${SOURCE_SHA}-alpine"
          source="https://github.com/${GITHUB_REPOSITORY}/tree/${SOURCE_SHA}"
          {
            echo "image=${image}"
            echo "sha_image=${sha_image}"
            echo "version=dev-${SOURCE_SHA}"
            echo "source=${source}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Build per-architecture Alpine smoke images
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: bash .github/scripts/atlas-alpine-smoke.sh

      - name: Push verified dev Alpine image
        id: build
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          context: ./.github/ops/atlas
          file: ./.github/ops/atlas/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.sha_image }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ needs.resolve.outputs.sha }}
            SOURCE=${{ steps.image.outputs.source }}

      - name: Sign dev image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Cleanup dev GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-tags: '^sha-[0-9a-f]{40}-alpine$'
          use-regex: true
          keep-n-tagged: 5
          exclude-tags: '^(dev|dev-alpine)$'
          delete-untagged: true
          delete-orphaned-images: true
          validate: true

name: Validate - Atlas CLI Pre-release

on:
  pull_request:
    paths:
      - "cmd/atlas/**"
      - "internal/integration/**"
      - "schemahcl/**"
      - "sql/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/cli-prerelease_oss.yaml"
  push:
    branches:
      - dev
    paths:
      - "cmd/atlas/**"
      - "internal/integration/**"
      - "schemahcl/**"
      - "sql/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/cli-prerelease_oss.yaml"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-hex commit SHA to test (defaults to the ref head)
        required: false
        type: string
      run_integration:
        description: Run the TiDB 5/6/8 integration and script matrix
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || 'dev-dispatch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATLAS_NO_UPGRADE_SUGGESTIONS: 1

jobs:
  resolve:
    name: Resolve source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Validate source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA}"
          if [ -z "${sha}" ]; then
            sha="${DEFAULT_SHA}"
          fi
          if ! printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "commit_sha must be a full 40-hex commit SHA, got: ${sha}" >&2
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" >/dev/null; then
            echo "commit ${sha} was not found in ${GITHUB_REPOSITORY}; push it to a branch first" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  unit:
    name: Unit and CLI tests
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - name: Run SQL and migration tests
        run: go test ./sql/mysql ./sql/migrate ./sql/internal/specutil ./sql/internal/sqlx -count=1
      - name: Run CLI tests
        working-directory: cmd/atlas
        run: go test ./... -count=1

  build:
    name: Build linux/${{ matrix.arch }}
    needs: [unit, resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - name: Build Atlas
        working-directory: cmd/atlas
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: dev-${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p ../../dist
          binary="../../dist/atlas-linux-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X ariga.io/atlas/cmd/atlas/internal/cmdapi.version=${VERSION}" \
            -o "${binary}" .
          sha256sum "${binary}" > "${binary}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-cli-linux-${{ matrix.arch }}-${{ needs.resolve.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: TiDB integration matrix
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.run_integration) }}
    needs: [unit, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/atlas/go.mod
      - name: Start TiDB services
        working-directory: internal/integration
        run: docker compose --project-name atlas-integration up -d tidb5 tidb6 tidb8
      - name: Run TiDB integration matrix
        working-directory: internal/integration
        run: |
          for version in tidb5 tidb6 tidb8; do
            go test -run '^TestTiDB_' -version="${version}" -timeout 15m ./...
            go test -run '^TestTiDB_Script$' -version="${version}" -timeout 15m ./...
          done

  sign:
    name: Publish trusted dev release
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped') }}
    needs: [build, integration, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: atlas-cli-linux-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign binaries
        run: |
          for binary in dist/atlas-linux-*; do
            case "${binary}" in
              *.sha256|*.bundle) continue ;;
            esac
            cosign sign-blob --yes --bundle "${binary}.bundle" "${binary}"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-cli-signed-${{ needs.resolve.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish mutable dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: dev
          DEV_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh release delete "${DEV_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${DEV_TAG}" >/dev/null 2>&1 || true

          gh release create "${DEV_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${DEV_SOURCE_SHA}" \
            --title "Atlas CLI ${DEV_TAG}" \
            --prerelease \
            --generate-notes
